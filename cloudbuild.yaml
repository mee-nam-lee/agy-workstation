substitutions:
  _REGION: 'us-central1'
  _REPO_NAME: 'containers'
  _IMAGE_NAME: 'selkies-antigravity'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}:latest'
      - '.'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}:latest'

timeout: 1800s
options:
  machineType: 'E2_HIGHCPU_8'
